<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>EduMoja — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        background: linear-gradient(160deg, #0f766e, #0f172a);
        color: #fff;
        text-align: center;
        padding: 24px;
      }
      h1 { font-size: 1.5rem; margin: 0 0 8px; }
      p { opacity: 0.9; max-width: 28rem; line-height: 1.45; }
      button {
        margin-top: 16px;
        border: 0;
        border-radius: 12px;
        padding: 12px 20px;
        font-weight: 700;
        background: #fff;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>EduMoja</h1>
      <p>You are offline. Reconnect to sync fees, students, and messages. Shell pages already on this device may still open from the home-screen icon.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
